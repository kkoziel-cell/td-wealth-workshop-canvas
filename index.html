<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TD Wealth — Workshop Canvas</title>
<script>
  (function() {
    var PASSWORD = 'WealthWorkshop26';
    var SESSION_KEY = 'tdws_auth';
    if (sessionStorage.getItem(SESSION_KEY) !== 'ok') {
      var attempt = window.prompt('TD Wealth Workshop — Enter access code:');
      if (attempt !== PASSWORD) {
        window.addEventListener('DOMContentLoaded', function() {
          while (document.body.firstChild) { document.body.removeChild(document.body.firstChild); }
          document.body.style.cssText = 'font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#1B2A4A;color:#fff;font-size:16px;';
          var msg = document.createElement('p');
          msg.textContent = 'Access denied. Please reload and try again.';
          document.body.appendChild(msg);
        });
        throw new Error('Access denied');
      }
      sessionStorage.setItem(SESSION_KEY, 'ok');
    }
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #F2F4F2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .app-header {
    background: #1B2A4A;
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
    flex-shrink: 0;
    border-bottom: 3px solid #2D7A3A;
  }
  .app-logo { height: 26px; }
  .app-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.15); flex-shrink:0; }
  .app-title { font-size: 14px; font-weight: 700; color: #FFFFFF; }
  .app-title-accent { color: #4CAF6E; }

  .save-indicator {

  .save-indicator.saved { color: #4CAF6E; }
  .save-dot {
    width: 7px; height: 7px; border-radius: 50%;

  }
  .save-indicator.saved .save-dot { background: #4CAF6E; }

  .main-tabs {
    background: #FFFFFF;
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 6px;
    flex-shrink: 0;
    border-bottom: 1px solid #E2E8F0;
  }
  .main-tab {
    padding: 7px 20px; font-size: 13px; font-weight: 600;
    color: #718096; border-radius: 6px; cursor: pointer;
    border: none; background: transparent;
    font-family: 'Inter', sans-serif; transition: all 0.15s;
  }
  .main-tab.active { background: #1B2A4A; color: #FFFFFF; }
  .main-tab:hover:not(.active) { background: #F7FAFC; color: #1B2A4A; }
  .fullscreen-btn {
    margin-left: auto; padding: 5px 14px; font-size: 10px; font-weight: 600;

  .lob-tabs {
    background: #F7FAFC;

    display: flex;

  .lob-tab {
    padding: 5px 14px; font-size: 11px; font-weight: 600;
    color: #718096; border-radius: 20px; cursor: pointer;
    white-space: nowrap; border: none; background: transparent;
    font-family: 'Inter', sans-serif; letter-spacing: 0.02em;
    text-transform: uppercase; transition: all 0.15s;
  }
  .lob-tab.active { background: #2D7A3A; color: #FFFFFF; }
  .lob-tab:hover:not(.active) { background: #E8F5EC; color: #2D7A3A; }

  .content { flex: 1; overflow: hidden; position: relative; }
  .panel { display: none; width: 100%; height: 100%; flex-direction: column; }
  .panel.active { display: flex; }

  .toolbar {
    background: #FFFFFF;
    padding: 7px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #E2E8F0;
    flex-shrink: 0;
  }
  .toolbar-label { font-size: 10px; font-weight: 600; color: #A0AEC0; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  .toolbar-divider { width: 1px; height: 20px; background: #E2E8F0; flex-shrink: 0; }
  .toolbar-hint { font-size: 10px; color: #CBD5E0; font-style: italic; }
  .toolbar-btn {
    padding: 4px 12px; font-size: 10px; font-weight: 600;
    border-radius: 4px; cursor: pointer; border: 1px solid #E2E8F0;
    background: #F7FAFC; color: #4A5568; font-family: 'Inter', sans-serif;

  .toolbar-btn:hover { background: #EDF2F7; }
  .toolbar-btn.danger:hover { background: #FFF5F5; border-color: #FC8181; color: #E53E3E; }

  .color-swatches { display: flex; gap: 5px; }

    width: 18px; height: 18px; border-radius: 4px; cursor: pointer;

  .color-swatch.selected { border-color: #1B2A4A; transform: scale(1.2); }
  .color-swatch:hover:not(.selected) { transform: scale(1.1); }

  /* Persona */
  .persona-switcher {
    background: #F7FAFC; padding: 8px 20px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #E2E8F0; flex-shrink: 0;
  }
  .persona-sw-btn {
    padding: 5px 18px; font-size: 12px; font-weight: 600;
    border-radius: 20px; cursor: pointer; border: 1.5px solid #E2E8F0;
    background: transparent; color: #718096; font-family: 'Inter', sans-serif; transition: all 0.15s;
  }
  .persona-sw-btn.active { background: #1B2A4A; color: #FFFFFF; border-color: #1B2A4A; }
  .persona-sw-btn:hover:not(.active) { background: #EDF2F7; color: #1B2A4A; }

  .persona-scroll { flex: 1; overflow: auto; }

  .pq-note { border-radius: 3px; padding: 7px 9px; box-shadow: 1px 2px 5px rgba(0,0,0,0.1); width: 100%; display: flex; flex-direction: column; gap: 2px; }
  .pq-note-text { background: transparent; border: none; outline: none; font-family: 'Inter', sans-serif; font-size: 11px; line-height: 1.5; color: rgba(0,0,0,0.72); resize: none; width: 100%; min-height: 60px; }
  .pq-note-del { align-self: flex-end; font-size: 11px; color: rgba(0,0,0,0.2); cursor: pointer; opacity: 0; transition: opacity 0.15s, color 0.15s; line-height: 1; }
  .pq-note:hover .pq-note-del { opacity: 1; }
  .pq-note-del:hover { color: rgba(200,0,0,0.65) !important; }
  .pq-add-note { margin-top: 6px; padding: 3px 8px; font-size: 10px; color: #A0AEC0; border: 1px dashed #CBD5E0; border-radius: 3px; background: transparent; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; display: block; width: 100%; text-align: center; }
  .pq-add-note:hover { background: #F0FFF4; border-color: #2D7A3A; color: #2D7A3A; }
  .persona-view { display: none; }
  .persona-view.active { display: block; }

  .persona-quads-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    min-width: 960px;
  }
  .persona-quad {
    display: flex; flex-direction: column;
    border-right: 1px solid #E2E8F0; border-bottom: 1px solid #E2E8F0;
    min-height: 300px;
  }
  .persona-quad:nth-child(3n) { border-right: none; }
  .persona-quad-header {
    background: #1B2A4A; padding: 11px 16px; flex-shrink: 0;
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.9);
  }
  .persona-quad-body {
    flex: 1; padding: 10px;
    background-image: radial-gradient(circle, #E2E8F0 1px, transparent 1px);
    background-size: 24px 24px; background-color: #FAFAFA;
  }
  .persona-quad-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: flex-start; min-height: 160px; }

  /* Blueprint */
  .blueprint-wrap { flex: 1; overflow: auto; position: relative; }
  .bp-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #A0AEC0; padding: 60px; }
  .bp-empty-icon { font-size: 44px; opacity: 0.35; }
  .bp-empty-text { font-size: 15px; font-weight: 700; }
  .bp-empty-sub { font-size: 12px; text-align: center; max-width: 320px; line-height: 1.7; }

  .bp-grid { display: grid; min-width: max-content; }
  .bp-corner { position: sticky; left: 0; top: 0; z-index: 20; background: #1B2A4A; min-width: 150px; border-bottom: 1px solid rgba(255,255,255,0.06); border-right: 1px solid rgba(255,255,255,0.06); }
  .bp-phase-header { position: sticky; top: 0; z-index: 5; background: #2D7A3A; min-width: 320px; border-left: 1px solid rgba(255,255,255,0.12); border-bottom: 1px solid rgba(255,255,255,0.1); }
  .bp-phase-inner { display: flex; align-items: center; padding: 10px 14px; gap: 8px; }
  .bp-phase-input {
    flex: 1; background: transparent; border: none; outline: none;
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700;
    color: #FFFFFF; letter-spacing: 0.06em; text-transform: uppercase; min-width: 0;
  }
  .bp-phase-input::placeholder { color: rgba(255,255,255,0.35); }
  .bp-phase-del { font-size: 13px; color: rgba(255,255,255,0.3); cursor: pointer; flex-shrink: 0; transition: color 0.15s; line-height: 1; }
  .bp-phase-del:hover { color: #FFFFFF; }
  .bp-row-label {
    position: sticky; left: 0; z-index: 10;
    background: #1B2A4A; color: rgba(255,255,255,0.85);
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06); border-right: 1px solid rgba(255,255,255,0.06);
    min-width: 160px; min-height: 180px; display: flex; align-items: flex-start; line-height: 1.4;
  }
  .bp-cell { background: #FFFFFF; border-left: 1px solid #E8EDF0; border-bottom: 1px solid #E8EDF0; padding: 10px; min-width: 320px; min-height: 180px; vertical-align: top; }
  .bp-cell.alt { background: #F7FAFC; }
  .bp-cell:hover { background: #FAFFFE; }
  .bp-cell.alt:hover { background: #F0FAF4; }
  .bp-cell-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-height: 120px; align-content: flex-start; }
  .bp-note { border-radius: 3px; padding: 7px 9px; box-shadow: 1px 2px 5px rgba(0,0,0,0.1); width: 100%; display: flex; flex-direction: column; gap: 2px; position: relative; }
  .bp-note-text { background: transparent; border: none; outline: none; font-family: 'Inter', sans-serif; font-size: 11px; line-height: 1.5; color: rgba(0,0,0,0.72); resize: none; width: 100%; min-height: 60px; }
  .bp-note-del { align-self: flex-end; font-size: 11px; color: rgba(0,0,0,0.2); cursor: pointer; opacity: 0; transition: opacity 0.15s, color 0.15s; line-height: 1; }
  .bp-note:hover .bp-note-del { opacity: 1; }
  .bp-note-del:hover { color: rgba(200,0,0,0.65) !important; }
  .bp-add-note { margin-top: 5px; padding: 3px 8px; font-size: 10px; color: #A0AEC0; border: 1px dashed #CBD5E0; border-radius: 3px; background: transparent; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; display: block; width: 100%; text-align: center; }
  .bp-add-note:hover { background: #F0FFF4; border-color: #2D7A3A; color: #2D7A3A; }
  .bp-add-phase { padding: 5px 14px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; border: 1.5px solid #2D7A3A; background: #FFFFFF; color: #2D7A3A; font-family: 'Inter', sans-serif; transition: all 0.15s; }
  .bp-add-phase:hover { background: #2D7A3A; color: #FFFFFF; }
</style>
</head>
<body>

<div class="app-header">
  <img class="app-logo" src="TD Logo.png" alt="TD">
  <div class="app-divider"></div>
  <div class="app-title">TD Wealth <span class="app-title-accent">Workshop Canvas</span></div>
  <div class="app-badge">Strategic Assessment · v3</div>
  <div class="save-indicator" id="save-indicator">
    <div class="save-dot"></div>
    <span id="save-label">All changes saved</span>
  </div>
</div>

<div class="main-tabs">
  <button class="main-tab active" data-main="persona">1.1 Persona Building</button>
  <button class="main-tab" data-main="blueprint">1.2 Lifecycle Blueprint</button>
  <button class="fullscreen-btn" id="fs-btn">⛶ Fullscreen</button>
</div>

<div class="lob-tabs" id="lob-tabs"></div>

<div class="content" id="content"></div>

<script>
var LOBS = [
  { id:'fp',     name:'Financial Planning',  personas:['Financial Planner','CSA / CRA / BO Support'],          roles:['advisor','support'] },
  { id:'pb',     name:'Private Banking',     personas:['Private Banker','Private Client Service Associate'],   roles:['advisor','support'] },
  { id:'pt',     name:'Private Trust',       personas:['Advisor'],                                            roles:['advisor'] },
  { id:'pia',    name:'PIA',                 personas:['Investment Advisor','Associate Investment Advisor'],   roles:['advisor','support'] },
  { id:'tdam_r', name:'TDAM Retail',         personas:['Wholesaler / BDM / RM'],                              roles:['advisor'] },
  { id:'tdam_i', name:'TDAM Institution',    personas:['Relationship Manager'],                               roles:['advisor'] },
  { id:'di_cc',  name:'DI Contact Centre',   personas:['Investment Representative'],                          roles:['advisor'] },
  { id:'wops',   name:'Wealth Ops',          personas:['Operations Specialist'],                              roles:['central'] }
];

var BP_ROWS = [
  { id:'actions',  label:'Actions' },
  { id:'motiv',    label:'Motivation' },
  { id:'data',     label:'Data | Insight Necessary' },
  { id:'tools',    label:'Tools Utilized' },
  { id:'handoffs', label:'Hand Offs' },
  { id:'pain',     label:'Pain Points' },
  { id:'opps',     label:'Opportunities' }
];

var COLORS = ['#FFE566','#FFB3C6','#74B9FF','#FFA07A','#FF7675','#A29BFE','#55EFC4','#FFEAA7'];
var ROLE_COLORS = { advisor: '#FFE566', support: '#FFB3C6', central: '#74B9FF' };

var activeMain = 'persona';
var activeLob  = 'fp';
var lobSwatches = {};

function skey(section, lob, extra) {
  return 'tdws::v3::' + section + '::' + lob + (extra !== undefined ? '::' + extra : '');
}
var saveTimer;
function saveData(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
  var ind = document.getElementById('save-indicator');
  var lbl = document.getElementById('save-label');
  if (!ind) return;
  ind.classList.add('saved');
  lbl.textContent = 'Saved';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function() {
    ind.classList.remove('saved');
    lbl.textContent = 'All changes saved';
  }, 2000);
}
function loadData(k, fb) { try { var r = JSON.parse(localStorage.getItem(k)); return r !== null ? r : fb; } catch(e) { return fb; } }

function mkEl(tag, cls) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function shade(hex, amt) {
  var h = hex.replace('#','');
  if (h.length !== 6) return hex;
  function cl(v) { return Math.max(0, Math.min(255, v)); }
  var r = cl(parseInt(h.slice(0,2),16) + amt);
  var g = cl(parseInt(h.slice(2,4),16) + amt);
  var b = cl(parseInt(h.slice(4,6),16) + amt);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ── LOB TABS ─────────────────────────────────────────────── */
function buildLobTabs() {
  var wrap = document.getElementById('lob-tabs');
  LOBS.forEach(function(lob) {
    var btn = mkEl('button','lob-tab');
    btn.textContent = lob.name;
    btn.dataset.lob = lob.id;
    if (lob.id === activeLob) btn.classList.add('active');
    btn.addEventListener('click', function() {
      document.querySelectorAll('.lob-tab').forEach(function(x){ x.classList.remove('active'); });
      btn.classList.add('active');
      activeLob = lob.id;
      showPanel(activeMain, activeLob);
    });
    wrap.appendChild(btn);
  });
}

/* ── MAIN TABS ────────────────────────────────────────────── */
document.querySelectorAll('.main-tab').forEach(function(t) {
  t.addEventListener('click', function() {
    document.querySelectorAll('.main-tab').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    activeMain = t.dataset.main;
    showPanel(activeMain, activeLob);
  });
});

document.getElementById('fs-btn').addEventListener('click', function() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(function(){});
  } else {
    document.exitFullscreen();
  }
});

function showPanel(main, lob) {
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  var target = document.querySelector('.panel[data-main="' + main + '"][data-lob="' + lob + '"]');
  if (target) target.classList.add('active');
}

/* ── COLOR SWATCHES HELPER ────────────────────────────────── */
function buildSwatches(containerId) {
  var wrap = mkEl('div','color-swatches');
  wrap.id = containerId;
  COLORS.forEach(function(c, i) {
    var sw = mkEl('div','color-swatch');
    if (i === 0) sw.classList.add('selected');
    sw.dataset.color = c;
    sw.style.background = c;
    sw.addEventListener('click', function() {
      wrap.querySelectorAll('.color-swatch').forEach(function(s){ s.classList.remove('selected'); });
      sw.classList.add('selected');
    });
    wrap.appendChild(sw);
  });
  return wrap;
}

function selectedColor(swatchesEl) {
  var sel = swatchesEl.querySelector('.color-swatch.selected');
  return sel ? sel.dataset.color : COLORS[0];
}

var PQ_QUADS = [
  { id:'exp',       label:'Experience Expectations' },
  { id:'rel',       label:'Relationships' },
  { id:'job',       label:'Job Function' },
  { id:'client',    label:'Client Base' },
  { id:'support',   label:'Support Structure' },
  { id:'day',       label:'Friction Points' },
  { id:'custom1',   label:'Custom 1' },
  { id:'custom2',   label:'Custom 2' },
  { id:'custom3',   label:'Custom 3' }
];

/* ── PERSONA PANEL ────────────────────────────────────────── */
function buildPersonaPanel(lob) {
  var panel = mkEl('div','panel');
  panel.dataset.main = 'persona';
  panel.dataset.lob  = lob.id;

  // Toolbar
  var tb = mkEl('div','toolbar');
  var colorLbl = mkEl('span','toolbar-label');
  colorLbl.textContent = 'Note Color';
  var swatches = buildSwatches('ps-sw-' + lob.id);
  var div1 = mkEl('div','toolbar-divider');
  var clearBtn = mkEl('button','toolbar-btn danger');
  clearBtn.textContent = 'Clear Persona';
  clearBtn.id = 'clear-persona-' + lob.id;

  var pLegend = mkEl('div');
  pLegend.style.cssText = 'display:flex; align-items:center; gap:10px; margin-left:auto;';
  [
    { color: ROLE_COLORS.advisor, label: 'Advisor / Relationship Owner' },
    { color: ROLE_COLORS.support, label: 'Support / Associate' },
    { color: ROLE_COLORS.central, label: 'Centralized / Cross-Team' }
  ].forEach(function(item) {
    var chip = mkEl('div');
    chip.style.cssText = 'display:flex; align-items:center; gap:5px; font-size:10px; font-weight:600; color:#4A5568;';
    var dot = mkEl('div');
    dot.style.cssText = 'width:12px; height:12px; border-radius:3px; background:' + item.color + '; border:1px solid rgba(0,0,0,0.1); flex-shrink:0;';
    var lbl = mkEl('span');
    lbl.textContent = item.label;
    chip.appendChild(dot);
    chip.appendChild(lbl);
    pLegend.appendChild(chip);
  });

  tb.appendChild(colorLbl);
  tb.appendChild(swatches);
  tb.appendChild(div1);
  tb.appendChild(clearBtn);
  tb.appendChild(pLegend);
  panel.appendChild(tb);

  // Persona switcher (only if 2+ personas)
  if (lob.personas.length > 1) {
    var switcher = mkEl('div','persona-switcher');
    var swLbl = mkEl('span','toolbar-label');
    swLbl.textContent = 'Persona';
    switcher.appendChild(swLbl);
    lob.personas.forEach(function(name, pi) {
      var btn = mkEl('button','persona-sw-btn');
      btn.textContent = name;
      if (pi === 0) btn.classList.add('active');
      btn.addEventListener('click', function() {
        switcher.querySelectorAll('.persona-sw-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        panel.querySelectorAll('.persona-view').forEach(function(v){ v.classList.remove('active'); });
        document.getElementById('pview-' + lob.id + '-' + pi).classList.add('active');
      });
      switcher.appendChild(btn);
    });
    panel.appendChild(switcher);
  }

  // Scroll container
  var scroll = mkEl('div','persona-scroll');

  lob.personas.forEach(function(name, pi) {
    var view = mkEl('div','persona-view');
    view.id = 'pview-' + lob.id + '-' + pi;
    if (pi === 0) view.classList.add('active');
    view.appendChild(buildQuadGrid(lob, name, pi, swatches));
    scroll.appendChild(view);
  });

  panel.appendChild(scroll);

  // Clear button wired after panel built
  clearBtn.addEventListener('click', function() {
    var activeView = panel.querySelector('.persona-view.active');
    var pi = activeView ? parseInt(activeView.id.split('-').pop()) : 0;
    var name = lob.personas[pi] || 'this persona';
    if (!confirm('Clear all notes for ' + name + '?')) return;
    PQ_QUADS.forEach(function(q) {
      var el = document.getElementById('pqcell-' + lob.id + '-' + pi + '-' + q.id);
      if (el) { while(el.firstChild) el.removeChild(el.firstChild); }

function makeDraggable(el, handle, onDone) {
  handle.addEventListener('mousedown', function(e) {
    e.preventDefault();
    var ox = e.clientX - (parseInt(el.style.left)||0);
    var oy = e.clientY - (parseInt(el.style.top) ||0);
    el.classList.add('dragging');
    function move(e) {
      el.style.left = Math.max(0, e.clientX - ox) + 'px';
      el.style.top  = Math.max(0, e.clientY - oy) + 'px';
    }
    function up() {
      el.classList.remove('dragging');
      if (onDone) onDone();
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

function renderGrid(lobId, swatches) {
  var wrap = document.getElementById('bp-wrap-' + lobId);
  if (!wrap) return;
  while (wrap.firstChild) wrap.removeChild(wrap.firstChild);

  var d = loadData(skey('blueprint', lobId), null);
  if (!d || !d.phases.length) {
    d = { phases: ['Phase 1','Phase 2','Phase 3','Phase 4','Phase 5','Phase 6'], cells: {} };
    saveData(skey('blueprint', lobId), d);
  }
  if (!d.phases.length) {
    var empty = mkEl('div','bp-empty');
    var ico = mkEl('div','bp-empty-icon');
    ico.textContent = '🗺️';
    var etxt = mkEl('div','bp-empty-text');
    etxt.textContent = 'No phases defined yet';
    var esub = mkEl('div','bp-empty-sub');
    esub.textContent = 'Click + Add Phase to define lifecycle stages live during the workshop. The grid grows horizontally as you add phases.';
    empty.appendChild(ico);
    empty.appendChild(etxt);
    empty.appendChild(esub);
    wrap.appendChild(empty);
    return;
  }

  var n = d.phases.length;
  var grid = mkEl('div','bp-grid');
  grid.style.gridTemplateColumns = '160px repeat(' + n + ', 320px)';

  /* corner */
  grid.appendChild(mkEl('div','bp-corner'));

  /* phase headers */
  d.phases.forEach(function(ph, pi) {
    var phCell  = mkEl('div','bp-phase-header');
    var inner   = mkEl('div','bp-phase-inner');
    var inp     = mkEl('input','bp-phase-input');
    inp.value       = ph;
    inp.placeholder = 'Phase name…';
    inp.addEventListener('change', function() {
      var d2 = loadData(skey('blueprint', lobId), {phases:[], cells:{}});
      d2.phases[pi] = inp.value;
      saveData(skey('blueprint', lobId), d2);
    });
    var del = mkEl('span','bp-phase-del');
    del.textContent = '✕';
    del.title = 'Remove phase';
    (function(capturedPi) {
      del.addEventListener('click', function() {
        var d2 = loadData(skey('blueprint', lobId), {phases:[], cells:{}});
        var phaseName = d2.phases[capturedPi] || 'Unnamed';
        if (!confirm('Remove phase "' + phaseName + '" and all its notes?')) return;
        d2.phases.splice(capturedPi, 1);
        BP_ROWS.forEach(function(r) {
          for (var j = capturedPi; j < d2.phases.length; j++) {
            d2.cells[r.id + '_' + j] = d2.cells[r.id + '_' + (j+1)] || [];
          }
          delete d2.cells[r.id + '_' + d2.phases.length];
        });
        saveData(skey('blueprint', lobId), d2);
        renderGrid(lobId, swatches);
      });
    })(pi);
    inner.appendChild(inp);
    inner.appendChild(del);
    phCell.appendChild(inner);
    grid.appendChild(phCell);
  });

  /* rows */
  BP_ROWS.forEach(function(row, ri) {
    var lbl = mkEl('div','bp-row-label');
    lbl.textContent = row.label;
    grid.appendChild(lbl);

    d.phases.forEach(function(_, pi) {
      var cellKey  = row.id + '_' + pi;
      var notes    = d.cells[cellKey] || [];
      var cell     = mkEl('div', ri % 2 === 0 ? 'bp-cell' : 'bp-cell alt');

      var notesDiv = mkEl('div','bp-cell-notes');
      notesDiv.id  = 'bpcell-' + lobId + '-' + row.id + '-' + pi;
      notes.forEach(function(n) { notesDiv.appendChild(buildBpNote(lobId, row.id, pi, n)); });

      var addBtn = mkEl('button','bp-add-note');
      addBtn.textContent = '+ note';
      (function(capturedRowId, capturedPi) {
        addBtn.addEventListener('click', function() {
          var color = selectedColor(swatches);
          var nid   = 'n' + Date.now() + Math.random().toString(36).slice(2,4);
          var noteData = { id: nid, color: color, text: '' };
          notesDiv.appendChild(buildBpNote(lobId, capturedRowId, capturedPi, noteData));
          saveBpCell(lobId, capturedRowId, capturedPi);
          var ta = notesDiv.lastElementChild && notesDiv.lastElementChild.querySelector('textarea');
          if (ta) ta.focus();
        });
      })(row.id, pi);

      cell.appendChild(notesDiv);
      cell.appendChild(addBtn);
      grid.appendChild(cell);
    });
  });

  wrap.appendChild(grid);
}

function buildBpNote(lobId, rowId, pi, data) {
  var n = mkEl('div','bp-note');
  n.dataset.id   = data.id;
  n.style.background = data.color;

  var ta = mkEl('textarea','bp-note-text');
  ta.value       = data.text;
  ta.placeholder = 'Note…';
  (function(capturedRowId, capturedPi) {
    ta.addEventListener('input', function() { saveBpCell(lobId, capturedRowId, capturedPi); });
  })(rowId, pi);

  var del = mkEl('span','bp-note-del');
  del.textContent = '✕';
  (function(capturedRowId, capturedPi) {
    del.addEventListener('click', function() { n.remove(); saveBpCell(lobId, capturedRowId, capturedPi); });
  })(rowId, pi);

  n.appendChild(ta);
  n.appendChild(del);
  return n;
}

function saveBpCell(lobId, rowId, pi) {
  var container = document.getElementById('bpcell-' + lobId + '-' + rowId + '-' + pi);
  if (!container) return;
  var d = loadData(skey('blueprint', lobId), {phases:[], cells:{}});
  var cellKey = rowId + '_' + pi;
  var notes = [];
  container.querySelectorAll('.bp-note').forEach(function(n) {
    notes.push({
      id:    n.dataset.id,
      color: n.style.background,
      text:  n.querySelector('textarea').value
    });
  });
  d.cells[cellKey] = notes;
  saveData(skey('blueprint', lobId), d);
}

function seedData() {
  LOBS.forEach(function(lob) {
    // Personas
    var personasForLob = PERSONA_SEED[lob.id];
    if (personasForLob) {
      Object.keys(personasForLob).forEach(function(piStr) {
        var pi = parseInt(piStr);
        var quadData = personasForLob[pi];
        PQ_QUADS.forEach(function(q) {
          var existing = loadData(skey('persona', lob.id, pi + '-' + q.id), null);
          if (existing !== null && existing.length > 0) return; // don't overwrite user edits
          var texts = quadData[q.id];
          if (!texts || !texts.length) return;
          var role = (lob.roles && lob.roles[pi]) || 'advisor';
          var noteColor = ROLE_COLORS[role] || COLORS[0];
          var notes = texts.map(function(t, i) {
            return { id: 'seed-' + lob.id + '-' + pi + '-' + q.id + '-' + i, color: noteColor, text: t };
          });
          saveData(skey('persona', lob.id, pi + '-' + q.id), notes);
        });
      });
    }

    // Blueprint phases + cells
    var existingBp = loadData(skey('blueprint', lob.id), null);
    var needsPhases = !existingBp || !existingBp.phases || existingBp.phases.every(function(p){ return !p || p.startsWith('Phase '); });
    var phases = needsPhases ? (DEFAULT_PHASES[lob.id] || ['Phase 1','Phase 2','Phase 3']) : existingBp.phases;
    var cells = (existingBp && existingBp.cells) ? existingBp.cells : {};

    // Seed blueprint cells if empty
    var lobBpSeed = BLUEPRINT_SEED[lob.id];
    if (lobBpSeed) {
      BP_ROWS.forEach(function(row) {
        var rowSeed = lobBpSeed[row.id];
        if (!rowSeed) return;
        Object.keys(rowSeed).forEach(function(piStr) {
          var pi = parseInt(piStr);
          var cellKey = row.id + '_' + pi;
          if (cells[cellKey] && cells[cellKey].length > 0) return; // don't overwrite
          var texts = rowSeed[pi];
          if (!texts || !texts.length) return;
          cells[cellKey] = texts.map(function(note, i) {
            var color = note.r ? (ROLE_COLORS[note.r] || COLORS[0]) : COLORS[i % COLORS.length];
            return { id: 'bseed-' + lob.id + '-' + row.id + '-' + pi + '-' + i, color: color, text: note.t || note };
          });
        });
      });
    }

    saveData(skey('blueprint', lob.id), { phases: phases, cells: cells });
  });
}

}
